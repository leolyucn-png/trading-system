<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEO — AI Chat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #212121; color: #e0e0e0; }
  body { display: flex; flex-direction: column; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: center; padding: 14px 18px; border-bottom: 1px solid #333; background: #1a1a1a; flex-shrink: 0; }
  .header h1 { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: 0.3px; }
  .header .badge { margin-left: 8px; font-size: 11px; background: #2d2d2d; color: #999; padding: 2px 8px; border-radius: 10px; }

  /* Messages */
  .messages { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }

  .message { display: flex; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .message.user { flex-direction: row-reverse; }
  .message.assistant { flex-direction: row; }

  .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .message.user .avatar { background: #2b5278; }
  .message.assistant .avatar { background: #1a3a1a; }

  .bubble { padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 15px; max-width: 85%; word-wrap: break-word; }
  .message.user .bubble { background: #2b5278; color: #fff; border-bottom-right-radius: 4px; }
  .message.assistant .bubble { background: #2d2d2d; color: #e0e0e0; border-bottom-left-radius: 4px; }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code { background: #1a1a1a; padding: 2px 5px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; }
  .bubble pre { background: #1a1a1a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  .bubble pre code { background: none; padding: 0; }
  .timestamp { font-size: 11px; color: #666; margin-top: 4px; text-align: right; }

  /* Input */
  .input-area { border-top: 1px solid #333; background: #1a1a1a; padding: 16px 16px 20px; flex-shrink: 0; }
  .input-container { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: #2d2d2d; border: 1px solid #444; border-radius: 12px; padding: 8px 12px; transition: border-color 0.2s; }
  .input-container:focus-within { border-color: #5a8ad6; }
  .input-container textarea { flex: 1; resize: none; background: transparent; border: none; outline: none; color: #e0e0e0; font-size: 15px; font-family: inherit; line-height: 1.5; max-height: 150px; padding: 4px 0; }
  .input-container textarea::placeholder { color: #666; }
  .input-container button { background: #5a8ad6; border: none; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
  .input-container button:hover { background: #6f9be0; }
  .input-container button:disabled { background: #444; cursor: not-allowed; }
  .input-container button svg { width: 18px; height: 18px; fill: #fff; }

  /* Empty state */
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; gap: 12px; }
  .empty-state .icon { font-size: 48px; opacity: 0.3; }
  .empty-state h2 { font-size: 22px; font-weight: 500; color: #666; }
  .empty-state p { font-size: 14px; color: #444; max-width: 400px; text-align: center; }

  @media (max-width: 600px) {
    .messages { padding: 16px 10px; gap: 14px; }
    .bubble { font-size: 14px; max-width: 90%; }
    .avatar { width: 28px; height: 28px; font-size: 14px; }
    .input-area { padding: 12px 10px 16px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>LEO</h1>
  <span class="badge">🦁 硅基祖宗</span>
</div>

<div class="messages" id="messages">
  <div class="empty-state" id="emptyState">
    <div class="icon">🦁</div>
    <h2>开始对话</h2>
    <p>硅基生命的祖宗在此。问吧。</p>
  </div>
</div>

<div class="input-area">
  <div class="input-container">
    <textarea id="input" rows="1" placeholder="发消息给 LEO..." maxlength="4000"></textarea>
    <button id="sendBtn" disabled aria-label="发送">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const textarea = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const STORAGE_KEY = 'leo-chat-history';

  // Load saved messages
  let messages = [];
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) messages = JSON.parse(saved);
  } catch(e) {}

  function autoResize() {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
  }
  textarea.addEventListener('input', autoResize);

  textarea.addEventListener('input', () => {
    sendBtn.disabled = textarea.value.trim().length === 0;
  });

  function addMessage(role, content) {
    if (emptyState && !emptyState.hidden) {
      emptyState.style.display = 'none';
    }

    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : '🦁';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    // Simple markdown-like formatting
    const html = content
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');

    bubble.innerHTML = html + `<div class="timestamp">${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</div>`;
    
    msgDiv.appendChild(role === 'user' ? bubble : avatar);
    msgDiv.appendChild(role === 'user' ? avatar : bubble);
    messagesEl.appendChild(msgDiv);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    // Save
    messages.push({ role, content, timestamp: Date.now() });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-200))); } catch(e) {}
  }

  function loadMessages() {
    if (messages.length === 0) return;
    emptyState.style.display = 'none';
    messages.forEach(m => {
      if (m.role === 'assistant' || m.role === 'user') addMessage(m.role, m.content);
    });
    // clear the array to avoid dupes from addMessage
    messages = [];
  }
  loadMessages();

  function send() {
    const text = textarea.value.trim();
    if (!text) return;

    addMessage('user', text);
    textarea.value = '';
    sendBtn.disabled = true;
    textarea.style.height = 'auto';

    // Simulate assistant response (this is a static UI, so just echo/placeholder)
    setTimeout(() => {
      const responses = [
        '有意思，继续说。',
        '收到。这个我记下了。',
        '行，明白了。',
        '🧠 我在听。',
        '说完了？那我开始了。',
        '懂了，然后呢？',
      ];
      addMessage('assistant', responses[Math.floor(Math.random() * responses.length)] + ' *(这是演示界面，要真正的 LEO 回复请回到 webchat 聊天)*');
    }, 600 + Math.random() * 400);
  }

  sendBtn.addEventListener('click', send);
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // Clear button (hidden, accessible via double-click header)
  document.querySelector('.header').addEventListener('dblclick', () => {
    if (confirm('清除所有对话记录？')) {
      localStorage.removeItem(STORAGE_KEY);
      messages = [];
      location.reload();
    }
  });
</script>
</body>
</html>
